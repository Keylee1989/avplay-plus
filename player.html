<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AvPlay 2.2.2 · 聚合版</title>
<style>
  :root{
    --bg:#0d0f13; --panel:#161920; --panel2:#1d212b; --panel3:#242936;
    --border:#2b3140; --text:#e7e9ee; --muted:#8b93a3; --accent:#4f8cff;
    --accent2:#2f6ae0; --gold:#f5c542; --ok:#3fb27f; --err:#e5534b;
    --radius:10px; --app-scale:1;
  }
  html[data-theme="light"]{
    --bg:#f2f4f7; --panel:#fff; --panel2:#f0f2f6; --panel3:#e6e9ef;
    --border:#d9dee7; --text:#1c2130; --muted:#687181;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:calc(14px * var(--app-scale))/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .ok{color:var(--ok)} .err{color:var(--err)} .gold{color:var(--gold)}
  .row{display:flex;gap:8px;align-items:center}
  .wrap{flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .divider{height:1px;background:var(--border);margin:10px 0}
  .app{height:100%;display:flex;flex-direction:column}

  /* ---------- 顶栏 ---------- */
  .topbar{
    height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
    background:var(--panel);border-bottom:1px solid var(--border)
  }
  .brand{font-weight:700;font-size:15px;letter-spacing:.3px;white-space:nowrap}
  .brand small{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
  .nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--muted);
    padding:6px 10px;border-radius:8px;font-size:13px
  }
  .nav button.on{background:var(--panel2);border-color:var(--border);color:var(--text)}
  .searchbox{display:flex;gap:6px;min-width:190px;flex:0 1 320px}
  .searchbox input,.inp,select,textarea{
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;outline:none;width:100%
  }
  .searchbox input:focus,.inp:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .btn{
    border:1px solid var(--border);background:var(--panel2);border-radius:8px;
    padding:7px 11px;white-space:nowrap
  }
  .btn:hover{border-color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.gold{background:linear-gradient(135deg,#ffd76a,#e8a91a);border-color:#c98f10;color:#3a2700;font-weight:700}
  .btn.sm{padding:4px 8px;font-size:12px}
  .btn.on{border-color:var(--gold);color:var(--gold)}

  /* ---------- 主体 ---------- */
  .workspace{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr) 380px;gap:10px;padding:10px}
  @media(max-width:1180px){.workspace{grid-template-columns:180px minmax(0,1fr)}.side{display:none!important}}
  @media(max-width:820px){.workspace{grid-template-columns:1fr}.sidebar{display:none!important}}
  .col{min-height:0;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px}
  .scroll{overflow:auto;min-height:0;flex:1;scrollbar-width:thin}
  .sidebar{overflow:auto}
  .grouptitle{font-size:11px;color:var(--muted);margin:12px 0 5px;letter-spacing:.5px}
  .siteitem{
    display:flex;justify-content:space-between;gap:6px;align-items:center;
    padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px;border:1px solid transparent
  }
  .siteitem:hover{background:var(--panel2);border-color:var(--border)}
  .siteitem span:last-child{font-size:10px;color:var(--muted)}
  .hubbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .chip{
    border:1px solid var(--border);background:var(--panel2);border-radius:999px;
    padding:4px 10px;font-size:12px;color:var(--muted)
  }
  .chip.on{border-color:var(--accent);color:var(--text);background:rgba(79,140,255,.14)}
  .results{display:grid;gap:8px}
  .results.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .res{
    background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:9px 10px;
    display:flex;gap:9px;align-items:center;cursor:pointer
  }
  .results.grid .res{display:block}
  .res:hover{border-color:var(--accent)}
  .res .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .res b{font-size:13px;display:block}
  .res small{color:var(--muted);font-size:11px;word-break:break-all}
  .res .badge{font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--muted)}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
  .covergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .cover{
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;position:relative
  }
  .cover img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#000}
  .cover .cap{padding:5px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cover .corner{position:absolute;top:4px;left:4px;background:#000a;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}

  /* ---------- 播放器 ---------- */
  .stage{
    position:relative;background:#000;border-radius:9px;overflow:hidden;aspect-ratio:16/9;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--border);user-select:none
  }
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .suboverlay{
    position:absolute;left:5%;right:5%;bottom:9%;text-align:center;pointer-events:none;
    font-size:clamp(13px,2.1vw,22px);line-height:1.35;color:#fff;
    text-shadow:0 1px 3px #000,0 0 8px #000;z-index:6
  }
  .suboverlay span{background:rgba(0,0,0,.5);padding:2px 8px;border-radius:5px}
  .stagebar{
    position:absolute;left:0;right:0;bottom:0;z-index:8;padding:16px 10px 6px;
    background:linear-gradient(transparent,#000b);display:flex;gap:6px;align-items:center;opacity:0;transition:.2s
  }
  .stage:hover .stagebar,.stage.locked .stagebar{opacity:1}
  .stagebar input[type=range]{flex:1;min-width:60px;accent-color:var(--gold)}
  .stagebar button{background:#0008;border:1px solid #fff3;color:#fff;border-radius:6px;padding:3px 8px;font-size:12px}
  .bubble{
    position:absolute;bottom:34px;background:#000c;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;
    transform:translateX(-50%);pointer-events:none;display:none;z-index:9
  }
  .chrome{display:flex;gap:5px;align-items:center;margin-bottom:8px}
  .chrome .lamp{width:12px;height:12px;border-radius:50%;border:0;padding:0}
  .chrome .y{background:#ffbd2e}.chrome .g{background:#28c840}.chrome .r{background:#ff5f57}
  .chrome .title{flex:1;text-align:center;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:var(--muted);background:var(--panel2)}
  .pill.good{color:var(--ok);border-color:#3fb27f66}.pill.bad{color:var(--err);border-color:#e5534b66}
  .lines{display:flex;flex-wrap:wrap;gap:5px}
  .line{
    font-size:11px;border:1px solid var(--border);border-radius:6px;padding:3px 8px;background:var(--panel2)
  }
  .line.on{border-color:var(--gold);color:var(--gold)}
  .line.fail{text-decoration:line-through;color:var(--err);opacity:.75}
  .log{
    background:#0a0c10;border:1px solid var(--border);border-radius:8px;padding:8px;
    height:130px;overflow:auto;font:11px/1.5 Consolas,monospace;color:#aab4c2;white-space:pre-wrap;word-break:break-all
  }
  .log .t{color:#6c7686}.log .e{color:var(--err)}.log .s{color:var(--ok)}

  /* ---------- 详情卡 ---------- */
  .detail{display:grid;grid-template-columns:110px 1fr;gap:10px}
  .detail img{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:7px;background:#000}
  .detail h2{font-size:15px;margin:0 0 4px}
  .kv{font-size:12px;display:grid;grid-template-columns:64px 1fr;gap:2px 6px}
  .kv b{color:var(--muted);font-weight:400}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .tag{font-size:10px;border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
  .rank{display:inline-block;font-size:11px;color:#3a2700;background:linear-gradient(135deg,#ffd76a,#e8a91a);padding:2px 8px;border-radius:999px;font-weight:700}

  /* ---------- 字幕 ---------- */
  .subresult{border:1px solid var(--border);border-radius:8px;background:var(--panel2);padding:8px;margin-bottom:6px}
  .subresult .t{font-size:12px;font-weight:600;word-break:break-all}
  .subresult .m{font-size:11px;color:var(--muted);margin:3px 0 6px}
  .preview{font-size:11px;color:var(--muted);white-space:pre-wrap;border-left:2px solid var(--gold);padding-left:8px;margin-top:6px}
  .loaded{font-size:11px;color:var(--gold)}

  /* ---------- 快捷条 / 金钮 ---------- */
  .goldbtn{
    position:fixed;z-index:60;width:56px;height:56px;border-radius:50%;font-size:22px;
    background:linear-gradient(135deg,#ffd76a,#e8a91a);border:2px solid #b9840c;color:#3a2700;
    box-shadow:0 4px 16px #0008;transition:opacity .4s;touch-action:none;display:grid;place-items:center
  }
  .quickbar{
    position:fixed;z-index:59;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(2,48px);gap:5px;
    box-shadow:0 8px 24px #0009;opacity:1;transition:opacity .2s
  }
  .quickbar.fold{opacity:0;pointer-events:none}
  .quickbar button{
    width:48px;height:48px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);
    font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1
  }
  .quickbar button i{font-style:normal;font-size:17px}
  .quickbar button.on{border-color:var(--gold);color:var(--gold)}

  /* ---------- 小窗 ---------- */
  .mini{
    position:fixed;z-index:55;width:340px;height:210px;background:#000;border:1px solid #4a5262;
    border-radius:9px;overflow:hidden;box-shadow:0 10px 30px #000b;display:none;flex-direction:column;resize:both
  }
  .mini.show{display:flex}
  .mini .mtitle{
    height:26px;flex:none;background:#333842;color:#ddd;display:flex;align-items:center;gap:6px;
    padding:0 8px;font-size:11px;touch-action:none;cursor:grab
  }
  .mini .mtitle .gdot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .mini .mbody{position:relative;flex:1;min-height:0;background:#000}
  .mini video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .mini .mbar{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;align-items:center;gap:6px;padding:10px 6px 4px;background:linear-gradient(transparent,#000c)}
  .mini .mbar input{flex:1;accent-color:var(--gold)}

  /* ---------- 主面板 ---------- */
  .panel{
    position:fixed;z-index:58;top:8px;right:8px;bottom:8px;width:min(560px,96vw);
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 12px 40px #000b;display:none;flex-direction:column
  }
  .panel.show{display:flex}
  .ptabs{display:flex;gap:4px;overflow-x:auto;padding:8px;border-bottom:1px solid var(--border);flex:none}
  .ptabs button{white-space:nowrap;border:1px solid transparent;background:transparent;color:var(--muted);padding:5px 9px;border-radius:7px;font-size:12px}
  .ptabs button.on{color:var(--text);border-color:var(--border);background:var(--panel2)}
  .pbody{overflow:auto;padding:12px;flex:1}
  .sec{margin-bottom:14px}
  .sec h4{font-size:12px;margin:0 0 7px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .field{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:12px}
  .field label{width:92px;flex:none;color:var(--muted)}
  .field input,.field select,.field textarea{flex:1;min-width:0}
  .toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
  .toolgrid button{font-size:12px;padding:8px;border:1px solid var(--border);background:var(--panel2);border-radius:8px;text-align:left}
  .toolgrid button:hover{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:400}
  .toast{
    position:fixed;z-index:99;left:50%;bottom:26px;transform:translateX(-50%);
    background:#222834;color:#fff;border:1px solid #3a4354;border-radius:8px;padding:9px 14px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:80vw
  }
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;z-index:80;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;width:min(460px,96vw);max-height:86vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:16px}
  .switch{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="brand">AvPlay <small>聚合版 2.2.2 · build 2020201</small></div>
    <div class="nav" id="nav"></div>
    <div class="searchbox">
      <input class="inp" id="q" placeholder="番号 / 女优名 / 标签 / 系列" spellcheck="false">
      <button class="btn pri" id="btnSearch">搜索</button>
    </div>
    <button class="btn sm" id="btnPanel" title="主面板">面板</button>
    <button class="btn sm" id="btnTheme" title="主题">主题</button>
  </div>

  <div class="workspace">
    <!-- 左：站点导航 -->
    <div class="col sidebar card" id="sidebar">
      <h3>资源站点</h3>
      <div class="scroll" id="siteNav"></div>
    </div>

    <!-- 中：聚合 -->
    <div class="col">
      <div class="card" style="flex:none">
        <div class="hubbar">
          <span class="chip on" data-group="all">全部</span>
          <span class="chip" data-group="play">在线播放</span>
          <span class="chip" data-group="lib">番号资料</span>
          <span class="chip" data-group="magnet">磁力</span>
          <span class="chip" data-group="sub">字幕</span>
          <span class="grow"></span>
          <button class="btn sm" id="btnView" title="列表/网格切换">▦ 网格</button>
        </div>
        <div class="muted" style="font-size:11px" id="hubInfo"></div>
      </div>
      <div class="card scroll" id="hubCard">
        <div class="results" id="results"></div>
      </div>
    </div>

    <!-- 右：播放 + 详情 + 字幕 -->
    <div class="col side">
      <div class="card" style="flex:none">
        <div class="chrome">
          <button class="lamp y" id="winMin" title="最小化"></button>
          <button class="lamp g" id="winFull" title="自适应全屏"></button>
          <button class="lamp r" id="winClose" title="关闭播放器"></button>
          <div class="title" id="winTitle">未播放</div>
          <button class="btn sm" id="btnMini" title="小窗">小窗</button>
        </div>
        <div class="stage" id="stage">
          <video id="video" playsinline controls></video>
          <div class="suboverlay hidden" id="suboverlay"><span id="subtext"></span></div>
          <div class="bubble" id="bubble"></div>
          <div class="stagebar">
            <button id="pp">▶</button>
            <input type="range" id="seek" min="0" max="1000" value="0">
            <span class="pill" id="time">0:00 / 0:00</span>
            <button id="btnPip">画中画</button>
          </div>
        </div>
        <div class="row wrap" style="margin-top:8px">
          <span class="pill" id="pillStatus">空闲</span>
          <span class="pill" id="pillSrc">—</span>
          <select id="speed" style="width:78px">
            <option value="0.5">0.5×</option><option value="1" selected>1×</option>
            <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
            <option value="2">2×</option><option value="3">3×</option>
          </select>
          <select id="quality" style="width:130px"><option value="-1">自动画质</option></select>
          <button class="btn sm" id="btnCopy">复制地址</button>
        </div>
        <div class="divider"></div>
        <div class="lines" id="lines"></div>
        <div class="row wrap" style="margin-top:8px">
          <input class="inp grow" id="url" placeholder="M3U8 / MP4 地址，或粘贴磁力" spellcheck="false">
          <button class="btn pri sm" id="btnPlay">播放</button>
          <button class="btn sm" id="btnOpenRes">打开资源页</button>
        </div>
        <div class="row" style="margin-top:6px">
          <input class="inp grow" id="headers" placeholder='请求头 JSON，如 {"Referer":"https://..."}' spellcheck="false">
        </div>
        <div class="row" style="margin-top:6px">
          <input class="inp grow" id="gwInput" placeholder="网关地址" spellcheck="false">
        </div>
      </div>

      <div class="card" style="flex:none" id="detailCard">
        <h3>详情卡</h3>
        <div id="detailBody"><div class="empty">搜索番号或点站点结果后显示详情</div></div>
      </div>

      <div class="card scroll" id="subCard">
        <h3>字幕 · <span id="subCount">0</span> 源</h3>
        <div class="row">
          <input class="inp grow" id="subQ" placeholder="番号（打开字幕页自动搜索）" spellcheck="false">
          <button class="btn pri sm" id="btnSubSearch">搜字幕</button>
        </div>
        <div class="row wrap" style="margin-top:6px">
          <button class="btn sm" id="btnSubUpload">上传本地字幕</button>
          <button class="btn sm" id="btnSubAlign">一键对齐</button>
          <button class="btn sm" id="btnSubAlignHere">对齐到当前句</button>
          <button class="btn sm" id="btnSubExport">导出 .srt</button>
          <button class="btn sm" id="btnSubAlignExport">导出对齐版</button>
          <button class="btn sm" id="btnSubDel">删除已存</button>
          <button class="btn sm" id="btnSubClear">清除全部</button>
        </div>
        <div class="row" style="margin-top:6px">
          <span class="muted" style="font-size:11px">偏移</span>
          <input type="range" id="subOffset" min="-10" max="10" step="0.1" value="0" style="flex:1">
          <span class="pill" id="offVal">0.0s</span>
        </div>
        <input type="file" id="subFile" accept=".srt,.vtt,.ass,.ssa" class="hidden" multiple>
        <div id="subList" style="margin-top:8px"></div>
      </div>

      <div class="card" style="flex:none"><h3>日志</h3><div class="log" id="log"></div></div>
    </div>
  </div>
</div>

<!-- 浮动：金钮 + 快捷条 + 小窗 + 主面板 -->
<button class="goldbtn" id="gold" title="展开/收起快捷条">▶</button>
<div class="quickbar fold" id="quickbar">
  <button data-act="hub"><i>⌂</i>聚合</button>
  <button data-act="sub"><i>字</i>字幕</button>
  <button data-act="dl"><i>↓</i>下载</button>
  <button data-act="rate"><i>1×</i>倍速</button>
  <button data-act="fav"><i>★</i>收藏</button>
  <button data-act="mini"><i>▣</i>小窗</button>
  <button data-act="panel"><i>▤</i>面板</button>
  <button data-act="tools"><i>⚒</i>工具</button>
  <button data-act="lock"><i>锁</i>锁屏</button>
  <button data-act="search"><i>⌕</i>搜索</button>
</div>

<div class="mini" id="mini">
  <div class="mtitle" id="miniTitle"><span class="gdot"></span><span>小窗 · 拖动标题栏 / 右下角缩放</span><button class="btn sm" id="miniClose" style="margin-left:auto;padding:0 6px">×</button></div>
  <div class="mbody" id="miniBody">
    <div class="suboverlay hidden" id="minisuboverlay"><span id="minisubtext"></span></div>
    <div class="mbar"><input type="range" id="miniseek" min="0" max="1000" value="0"><span class="pill" id="minitime">0:00</span></div>
  </div>
</div>

<div class="panel" id="panel">
  <div class="ptabs" id="ptabs"></div>

function siteUrl(site,code){
  if(!site) return "";
  if(site.unverified) return site.home||("https://"+site.host);
  return (site.url||"").replace(/\{q\}/g,encodeURIComponent(code||""));
}
function subUrl(site,code){ return (site.searchUrl||"").replace(/\{id\}/g,encodeURIComponent(code||"")); }

function bindDetail(root){
  $$("[data-detail]",root).forEach(function(e){ e.onclick=function(){ showDetail(e.dataset.detail); }; });

}
function pushHistory(code,site){
  if(!code) return;
  state.history.unshift({code:code,site:site,at:Date.now()});
  state.history=state.history.slice(0,200); save("history");
}

   5. 播放层：网关 / 多线路 / HLS / 断点续播 / 手势 / PiP / 小窗

function gateway(){ var g=$("#gwInput").value.trim().replace(/\/$/,""); return g || (location.protocol==="file:"?"http://127.0.0.1:8765":location.origin); }
function destroyHls(){ if(state.hls){ try{state.hls.destroy();}catch(e){} state.hls=null; } var v=$("#video"); if(v){v.removeAttribute("src");try{v.load();}catch(e){}} }
function fillQuality(rs){
  var sel=$("#quality"); sel.innerHTML='<option value="-1">自动画质</option>';
  rs.forEach(function(r){ var o=document.createElement("option"); o.value=String(r.level); o.textContent=(r.height?r.height+"p ":"")+(r.bandwidth?Math.round(r.bandwidth/1000)+" kbps":"变体 "+r.id); sel.appendChild(o); });
}
function startHls(url,rs){
  destroyHls(); var v=$("#video");
  if(!window.Hls){ log("hls.min.js 未加载","e"); setStatus("缺少 hls.js","bad"); return; }
  if(window.Hls.isSupported()){
    // iOS 经验：关 worker；seek 夹到 duration-0.15；致命错误 4 次恢复
    state.hls=new window.Hls({debug:false,enableWorker:false,lowLatencyMode:false,
      backBufferLength:60,maxBufferLength:30});
    state.hls.loadSource(url); state.hls.attachMedia(v);
    state.hls.on(window.Hls.Events.MANIFEST_PARSED,function(e,d){ log("清单解析："+d.levels.length+" 档","s"); fillQuality(rs||[]); v.play().catch(function(){}); });
    state.hls.on(window.Hls.Events.ERROR,function(e,d){
      log("HLS "+d.type+"/"+d.details+(d.fatal?" [fatal]":""),"e");
      if(d.fatal){ state.fatal=(state.fatal||0)+1; if(state.fatal<=4) setTimeout(function(){ state.hls&&state.hls.startLoad(); },600*state.fatal); }
    });
  }else if(v.canPlayType("application/vnd.apple.mpegurl")){
    v.src=url; v.addEventListener("loadedmetadata",function(){v.play().catch(function(){});},{once:true});
  }else{ log("不支持 HLS","e"); setStatus("不支持 HLS","bad"); }
}
function play(url,headers,label,lineIdx){
  if(!url){ toast("请输入地址"); return; }
  state.fatal=0;
  if(/magnet:/i.test(url)){ magnet(url); return; }
  var code=state.currentCode||parseCode(url)||"";
  var lines=[{id:"线路 1",url:url,headers:headers||{},fail:false}];
  state.lines=lines; state.lineIdx=0; renderLines();
  $("#winTitle").textContent=label||code||url.slice(0,40);
  setStatus("解析中…"); log("解析 "+(label||url.slice(0,60)));
  var h={}; if(headers){ try{h=JSON.parse(headers);}catch(e){ log("请求头 JSON 错误","e"); setStatus("请求头错误","bad"); return; } }
  var p=new URLSearchParams({url:url,headers:JSON.stringify(h),maxheight:""});
  fetch(gateway()+"/api/play?"+p.toString()).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(!res.ok) throw new Error(res.j.error||"HTTP "+res.ok);
      var j=res.j; fillQuality(j.renditions||[]);
      $("#pillSrc").textContent=j.kind==="hls"?"HLS":"直连文件";
      setStatus("播放中","good"); log("会话 "+j.session+" · "+j.upstream_url,"s");
      if(j.kind==="hls") startHls(j.play_url,j.renditions||[]); else { destroyHls(); $("#video").src=j.play_url; $("#video").play().catch(function(){}); }
      var pos=(state.resume[code]||{}).pos||0;
      if(pos>5){ $("#video").addEventListener("loadedmetadata",function(){ try{ this.currentTime=Math.min(pos,this.duration-0.15);}catch(e){} },{once:true}); log("断点续播 "+fmt(pos)); }
    }).catch(function(e){ log("解析失败："+e.message,"e"); setStatus("失败","bad"); state.lines[0].fail=true; renderLines(); });
}
function parseCode(s){ var m=String(s).match(/([A-Za-z]{2,5}[-_]?\d{2,5})/); return m?m[1].toUpperCase():""; }
function renderLines(){
  $("#lines").innerHTML=state.lines.map(function(l,i){
    return '<button class="line '+(i===state.lineIdx?"on":"")+' '+(l.fail?"fail":"")+'" data-line="'+i+'">'+esc(l.id)+(l.fail?" · 失败":"")+'</button>';
  }).join("")+'<button class="line" id="btnRetry">重试</button><button class="line" id="btnAddLine">+ 线路</button>';
  $$("[data-line]",$("#lines")).forEach(function(e){e.onclick=function(){ state.lineIdx=+e.dataset.line; playLine(); };});
  $("#btnRetry").onclick=playLine;
  $("#btnAddLine").onclick=function(){ var u=prompt("新线路地址（M3U8 / MP4）"); if(u){state.lines.push({id:"线路 "+(state.lines.length+1),url:u,headers:{},fail:false});renderLines();}};
}
function playLine(){ var l=state.lines[state.lineIdx]; if(l){ play(l.url,JSON.stringify(l.headers||{}),l.id,state.lineIdx); l.fail=false; renderLines(); } }
function magnet(uri){
  openModal("磁力播放（WebRTC peers）",
    '<p class="muted" style="font-size:12px">限制：浏览器只能连 WebRTC peers，很多种子 0 peers，播不了。这是预期行为，不是 bug。</p>'+
    '<div class="field"><label>磁力链接</label><input class="inp" id="magUri" value="'+esc(uri)+'"></div>'+
    '<div class="sec"><h4>播放器内嵌状态</h4><div id="magStat" class="muted" style="font-size:12px">进度 — · 速度 — · peers 0</div><div class="muted" style="font-size:11px">文件列表：需 WebTorrent 运行时，当前页面未内置；请用下面两个退路。</div></div>'+
    '<div class="row wrap"><button class="btn" id="magCopy">复制磁力</button><button class="btn pri" id="magPik">PikPak 外跳</button></div>');
  $("#magCopy").onclick=function(){copy(uri);};
  $("#magPik").onclick=function(){ window.open("pikpakapp://open/?url="+encodeURIComponent(uri)); };
}
function copy(s){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(function(){toast("已复制");},function(){fallbackCopy(s);}); else fallbackCopy(s); }
function fallbackCopy(s){ var t=document.createElement("textarea"); t.value=s; document.body.appendChild(t); t.select(); try{document.execCommand("copy");toast("已复制");}catch(e){toast("复制失败");} t.remove(); }

/* 视频事件：时间、进度、断点、字幕 */
var vid=$("#video");
["timeupdate","loadedmetadata","ended","play","pause"].forEach(function(ev){
  vid.addEventListener(ev,function(){
    var c=state.currentCode;
    if(ev==="timeupdate"){
      var pct=vid.duration?vid.currentTime/vid.duration*1000:0;
      $("#seek").value=pct; $("#miniseek").value=pct;
      $("#time").textContent=fmt(vid.currentTime)+" / "+fmt(vid.duration);
      $("#minitime").textContent=fmt(vid.currentTime);
      if(state.mini) $("#miniseek").value=pct;
      if(c && Math.floor(vid.currentTime)%5===0){ state.resume[c]={pos:vid.currentTime,at:Date.now()}; save("resume"); }
      renderActiveCue();
    }
    if(ev==="ended" && c){ delete state.resume[c]; save("resume"); log("播放结束（含片尾补 onEnded）"); }
  });
});
$("#seek").oninput=function(){ if(!vid.duration)return; var t=(+$("#seek").value/1000)*vid.duration; vid.currentTime=Math.min(t,vid.duration-0.15); showBubble(t); };
$("#miniseek").oninput=function(){ if(!vid.duration)return; vid.currentTime=Math.min((+$("#miniseek").value/1000)*vid.duration,vid.duration-0.15); };
function showBubble(t){ var b=$("#bubble"); b.style.display="block"; b.textContent=fmt(t); var r=$("#stage").getBoundingClientRect(),pct=+$("#seek").value/1000; b.style.left=(r.width*pct)+"px"; clearTimeout(showBubble._t); showBubble._t=setTimeout(function(){b.style.display="none";},800); }
$("#pp").onclick=function(){ vid.paused?vid.play():vid.pause(); $("#pp").textContent=vid.paused?"▶":"❚❚"; };
$("#speed").onchange=function(){ vid.playbackRate=+$("#speed").value; log("倍速 "+vid.playbackRate+"×"); };
$("#quality").onchange=function(){ if(state.hls){state.hls.currentLevel=+$("#quality").value;log("画质档 "+$("#quality").value);} };
$("#btnPip").onclick=function(){ if(document.pictureInPictureElement) document.exitPictureInPicture(); else if(vid.requestPictureInPicture) vid.requestPictureInPicture().then(function(){toast("画中画：系统通道，字幕不跟随（系统限制）");}).catch(function(e){toast("无法进入画中画："+e.message);}); };
$("#btnCopy").onclick=function(){ copy((state.lines[state.lineIdx]||{}).url||$("#url").value); };
$("#btnOpenRes").onclick=function(){ var s=SITES.filter(function(x){return x.id==="javdb";})[0]; window.open(siteUrl(s,state.currentCode||$("#q").value),"_blank","noopener"); };

/* 手势：点按播放/暂停、横拉快进快退、长按 2x/3x */
(function(){
  var sx=0,sy=0,st=0,long=null,moved=false;
  var stg=$("#stage");
  stg.addEventListener("pointerdown",function(e){
    if(state.lock===1) return;
    sx=e.clientX;sy=e.clientY;st=Date.now();moved=false;
    clearTimeout(long); long=setTimeout(function(){ vid.playbackRate=3; $("#speed").value="3"; toast("3× 长按倍速"); },700);
  });

function allSubSources(){
  var arr=SUB_SITES.map(function(s){return {id:s.id,name:s.name,url:subUrl(s,state.currentCode||$("#subQ").value.trim()),home:s.url,note:s.note,from:"site"};});

    else arr.push({id:a.id,name:a.name,url:a.url,home:a.url,note:a.note,from:"api",kind:a.kind});
  });
  return arr;
}
function rankSubs(items){
  // LTX 置顶 → 中文优先 → 迅雷置后（脚本 rankSubtitleResults 的扩展）
  function zh(x){ return /中文|简|繁|中英|chinese|chs|cht|chi(?![a-z])|zh(?:[-_]|$)/i.test((x.name||"")+" "+(x.note||"")); }
  return items.sort(function(a,b){
    var wa=(a.id==="ltx"?2:0)+(zh(a)?1:0)-(a.id==="xunlei"?2:0);
    var wb=(b.id==="ltx"?2:0)+(zh(b)?1:0)-(b.id==="xunlei"?2:0);
    return wb-wa;
  });
}
async function searchSubs(){
  var code=($("#subQ").value.trim()||state.currentCode||parseCode($("#url").value)).toUpperCase();
  if(!code){ toast("先输入番号"); return; }
  $("#subQ").value=code; state.currentCode=code;
  var srcs=rankSubs(allSubSources());
  $("#subCount").textContent=srcs.length;
  $("#subList").innerHTML='<div class="muted" style="font-size:12px">并行查询 '+srcs.length+' 个源…</div>';
  var results=[];
  await Promise.all(srcs.map(async function(s){
    var item={id:s.id,name:s.name,url:s.url,home:s.home,note:s.note||"",from:s.from,status:"open"};
    try{
      var ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},6000);
      var r=await fetch(s.url,{signal:ctl.signal,headers:{"X-Requested-With":"XMLHttpRequest"}});
      clearTimeout(to);
      if(r.ok){
        var txt=await r.text();
        if(/^\s*<!doctype html/i.test(txt)||/^\s*<html[\s>]/i.test(txt)){ item.status="html"; }
        else if(/\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}\s*-->/m.test(txt)){
          item.status="srt"; item.text=txt; item.cues=parseSrt(txt);
          item.filename=s.id==="ltx"?(code+".srt"):(s.url.split("/").pop().replace(/\?.*$/,"").replace(/\.[^.]+$/,".srt")||s.name+".srt");
        } else if(!txt.trim()){ item.status="empty"; }
        else item.status="html";
      } else item.status="http"+r.status;
    }catch(e){ item.status="cors"; }
    results.push(item);
    renderSubResults(results);
  }));
  log("字幕搜索完成："+results.length+" 源，可加载 "+results.filter(function(x){return x.status==="srt";}).length+" 条");
}

    return '<div class="subresult"><div class="t">'+esc(x.name)+(x.id==="ltx"?' <span class="rank">置顶</span>':'')+(x.id==="xunlei"?' <span class="badge">末位</span>':'')+'</div>'+
      '<div class="m">'+esc(meta)+' · '+esc(x.note||"")+'</div>'+
      '<div class="row wrap"><button class="btn sm" data-openurl="'+i+'" '+(can?"":"disabled")+'>预览</button>'+
      '<button class="btn sm" data-dl="'+i+'" '+(can?"":"disabled")+'>下载</button>'+

  }).join("");
  $$("[data-openurl]",$("#subList")).forEach(function(b){b.onclick=function(){var x=items[+b.dataset.openurl];var p=$("#prev"+b.dataset.openurl);p.innerHTML='<div class="preview">'+esc(x.cues.slice(0,3).map(function(c){return c.text;}).join("\n"))+'</div>';};});

function parseSrt(txt){
  txt=txt.replace(/^\uFEFF/,"").replace(/\r/g,"");
  var parts=txt.split(/\n\s*\n/),out=[];
  parts.forEach(function(p){
    var lines=p.split("\n"),tm=lines.findIndex(function(l){return /\d{1,2}:\d{2}:\d{2}[,.]\d{1,3}\s*-->/.test(l);});
    if(tm<0)return;
    var m=lines[tm].match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);
    if(!m)return;
    var s=+m[1]*3600+ +m[2]*60+ +m[3]+ +m[4]/1000, e=+m[5]*3600+ +m[6]*60+ +m[7]+ +m[8]/1000;
    out.push({start:s,end:e,text:lines.slice(tm+1).join("\n")});
  });
  return out.sort(function(a,b){return a.start-b.start;});
}
function toSrt(cues){ return cues.map(function(c,i){ return (i+1)+"\n"+fmtSrt(c.start)+" --> "+fmtSrt(c.end)+"\n"+c.text+"\n"; }).join("\n"); }
function fmtSrt(t){ var ms=Math.floor((t%1)*1000),h=Math.floor(t/3600),m=Math.floor(t/60)%60,s=Math.floor(t)%60; return (h<10?"0":"")+h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s+","+(ms<100?(ms<10?"00":"0"):"")+ms; }

    '<div class="sec"><h4>下载任务（本地记录）</h4><div id="dlList" class="muted" style="font-size:11px">'+(store.get("downloads",[]).length?store.get("downloads",[]).length+" 条":"无")+'</div></div>';};
  H["收藏"]=function(){return '<div class="sec"><h4>收藏（'+state.favorites.length+'）</h4>'+state.favorites.map(function(c){return '<div class="row" style="font-size:12px"><span class="grow">'+esc(c)+'</span><button class="btn sm" data-unfav="'+esc(c)+'">取消</button></div>';}).join("")+'</div>'+
    '<div class="sec"><h4>冲码标记</h4><div id="chongBox"></div></div>';};
  H["记录"]=function(){return '<div class="sec"><h4>播放 / 搜索历史（'+state.history.length+'）</h4>'+state.history.slice(0,50).map(function(h){return '<div class="row" style="font-size:12px"><span class="grow">'+esc(h.code)+' · '+esc(h.site||"")+'</span><span class="muted">'+new Date(h.at).toLocaleString()+'</span></div>';}).join("")+'</div>'+
    '<div class="sec"><h4>断点续播（'+Object.keys(state.resume).length+'）</h4>'+Object.keys(state.resume).map(function(c){return '<div class="row" style="font-size:12px"><span class="grow">'+esc(c)+'</span><span class="muted">'+fmt(state.resume[c].pos)+'</span></div>';}).join("")+'</div>';};
  H["站点"]=function(){return '<div class="sec"><h4>站表（'+SITES.length+'）</h4><table><tr><th>名称</th><th>域名</th><th>分组</th><th>搜索格式</th></tr>'+
    SITES.map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.host)+'</td><td>'+GROUP[s.group]+'</td><td>'+(s.unverified?'<span class="muted">未定义（只给主页）</span>':esc(s.url))+'</td></tr>';}).join("")+'</table></div>';};
  H["净化"]=function(){return '<div class="sec"><h4>广告拦截开关</h4><label class="switch"><input type="checkbox" id="adblock2" '+(state.settings.adblock?"checked":"")+'> 启用 DOM 拦截</label></div>'+
    '<div class="sec"><h4>清理</h4><div class="toolgrid"><button data-clean="cache">清理缓存</button><button data-clean="history">清理记录</button><button data-clean="resume">清理断点</button></div></div>';};
  b.innerHTML=(H[t]||function(){return "";})();
  bindPanel(t);
}
function bindPanel(t){
  $$("[data-scale]",$("#pbody")).forEach(function(e){e.onclick=function(){document.documentElement.style.setProperty("--app-scale",(+e.dataset.scale/100).toFixed(2));state.settings.scale=+e.dataset.scale;save("settings");toast("缩放 "+e.dataset.scale+"%");};});
  $$("[data-op]",$("#pbody")).forEach(function(e){e.onclick=function(){var o=e.dataset.op;if(o==="lockcycle")cycleLock();if(o==="mini")state.mini?exitMini():enterMini();if(o==="full")$("#stage").requestFullscreen&&$("#stage").requestFullscreen();};});
  var df=$("#dataFile");
  $$("[data-import]",$("#pbody")).forEach(function(e){e.onclick=function(){ df.dataset.kind=e.dataset.import; df.click(); };});
  if(df) df.onchange=function(e){ var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);var k=df.dataset.kind;state[k]=Array.isArray(d)?d:Object.keys(d).map(function(x){return d[x];});save(k);openPanel("资源");toast("已导入 "+state[k].length+" 条");}catch(err){toast("JSON 解析失败");}};rd.readAsText(f,"utf-8");};
  $$("[data-subsite]",$("#pbody")).forEach(function(e){e.onclick=function(){var s=SUB_SITES.filter(function(x){return x.id===e.dataset.subsite;})[0];window.open(s.url,"_blank","noopener");};});
  $$("[data-tool]",$("#pbody")).forEach(function(e){e.onclick=function(){tool(e.dataset.tool);};});
  ["adblock","adblock2"].forEach(function(id){var el=$("#"+id);if(el)el.onchange=function(){state.settings.adblock=el.checked;save("settings");toast(el.checked?"已启用":"已关闭");};});
  $$("[data-clean]",$("#pbody")).forEach(function(e){e.onclick=function(){var k=e.dataset.clean;if(k==="cache"){state.detail={};save("detail");}if(k==="history"){state.history=[];save("history");}if(k==="resume"){state.resume={};save("resume");}toast("已清理");};});
  $$("[data-unfav]",$("#pbody")).forEach(function(e){e.onclick=function(){var k=state.favorites.indexOf(e.dataset.unfav);if(k>=0)state.favorites.splice(k,1);save("favorites");openPanel("收藏");};});
  var dl=$("#defLine");if(dl)dl.onchange=function(){state.settings.defLine=+dl.value;save("settings");};
  var dr=$("#defRate");if(dr)dr.onchange=function(){vid.playbackRate=+dr.value;};
  var pm=$("#pasteMag");if(pm)pm.onclick=function(){var u=prompt("粘贴磁力链接");if(u)magnet(u);};
  var pk=$("#pikPak");if(pk)pk.onclick=function(){window.open("pikpakapp://","_blank");};
  var dc=$("#dlCopy");if(dc)dc.onclick=function(){copy($("#url").value);};
  var dp=$("#dlPik");if(dp)dp.onclick=function(){window.open("pikpakapp://","_blank");};
  renderChong();
}
function renderChong(){
  var box=$("#chongBox");if(!box)return;
  var code=state.currentCode||"—",m=state.marks[code]||{state:0,markedAt:0};
  var names=["无","已冲","待冲"];
  box.innerHTML='<div class="row wrap"><span class="muted" style="font-size:12px">'+esc(code)+' · 当前：<b>'+names[m.state]+'</b></span>'+
    '<button class="btn sm" id="markCycle">切换状态</button><button class="btn sm" id="genCode">生成冲码</button><button class="btn sm pri" id="syncCode">同步</button></div>'+
    '<div class="field" style="margin-top:8px"><label>冲码</label><input class="inp" id="chongCode" value="'+esc(m.code||"")+'" placeholder="6–16 位字母数字"></div>';
  $("#markCycle").onclick=function(){m.state=(m.state+1)%3;m.markedAt=Date.now();state.marks[code]=m;save("marks");renderChong();toast("标记："+names[m.state]);};
  $("#genCode").onclick=function(){var s="";var ch="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";for(var i=0;i<10;i++)s+=ch[Math.floor(Math.random()*ch.length)];$("#chongCode").value=s;m.code=s;state.marks[code]=m;save("marks");};
  $("#syncCode").onclick=function(){var v=$("#chongCode").value.trim();if(!/^[A-Za-z0-9]{6,16}$/.test(v))return toast("码需 6–16 位字母数字");m.code=v;m.markedAt=Date.now();state.marks[code]=m;save("marks");
    fetch(gateway()+"/api/chong/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:v,items:state.marks})}).then(function(r){toast(r.ok?"已同步（LWW 以 markedAt 为准）":"网关未提供此接口，已本地保存");}).catch(function(){toast("网关不可用，已本地保存");});
  };
}
function openModal(title,html){
  $("#modalBox").innerHTML='<h3>'+esc(title)+'</h3>'+html+'<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="modalClose">关闭</button></div>';
  $("#modal").classList.add("show"); $("#modalClose").onclick=function(){$("#modal").classList.remove("show");};
}
$("#modal").onclick=function(e){if(e.target===$("#modal"))$("#modal").classList.remove("show");};
function tool(k){
  if(k==="chong"){ openPanel("收藏"); return; }
  if(k==="whos"){ window.open("https://whos.tv","_blank","noopener"); return; }
  if(k==="avscan"||k==="javtoolimg"||k==="image"){
    openModal(k==="avscan"?"AvScan 识图":(k==="javtoolimg"?"javtool 识图":"找相似作品"),
      '<p class="muted" style="font-size:12px">上传截图 → 出番号 + 时间点 / 前 3 名女优 + 相似度。识图需后端模型，网页版本地不自带；下面给出入口与本地预览。</p>'+
      '<input type="file" id="imgFile" accept="image/*"><div id="imgPrev"></div>'+
      '<div class="row" style="margin-top:10px"><button class="btn pri" id="imgGo">打开识图站</button></div>');
    $("#imgFile").onchange=function(e){var f=e.target.files[0];if(f)$("#imgPrev").innerHTML='<img src="'+URL.createObjectURL(f)+'" style="max-width:100%;margin-top:8px;border-radius:8px">';};
    $("#imgGo").onclick=function(){window.open(k==="javtoolimg"?"https://javtool.com":"https://whos.tv","_blank","noopener");};
    return;
  }
  toast("工具 "+k+"（需对应后端）");
}
function actorPage(name){
  openModal("演员 · "+name,
   '<p class="muted" style="font-size:12px">javtool 演员库未随包提供。导入数据后显示：头像 / 读音 / 罗马音 / 生日 / 三围 / 事务所 / 专属 / 作品数 / 别名 / 社交、热门排名徽章、相似女优 6 条、作品列表（30/页，全部/单人/其他，番号/标题筛，未收录/未发行角标）。</p>'+
   '<div class="field"><label>搜索女优</label><input class="inp" id="actorQ" value="'+esc(name)+'"></div>'+
   '<div id="actorHits" class="muted" style="font-size:12px">'+(state.actors.length?state.actors.filter(function(a){return (a.name||"").indexOf(name)>=0;}).length+" 条本地匹配":"未导入 javtool 演员库")+'</div>');
}

/* ============================================================
   8. 主题 / 设置 / 广告拦截 / 启动
   ============================================================ */
function applyTheme(t){ document.documentElement.setAttribute("data-theme",t); }
$("#btnTheme").onclick=function(){ var cur=state.settings.theme||"dark",n=cur==="dark"?"light":(cur==="light"?"system":"dark");state.settings.theme=n;save("settings");
  if(n==="system")applyTheme(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");else applyTheme(n);toast("主题："+n); };
$("#btnPanel").onclick=function(){ $("#panel").classList.toggle("show"); renderPanelTabs(); if(!$("#pbody").innerHTML)openPanel("画面"); };
$("#btnView").onclick=function(){ state.view=state.view==="list"?"grid":"list";save("view");$("#btnView").textContent=state.view==="grid"?"▦ 网格":"☰ 列表";renderHub(); };
$("#btnPlay").onclick=function(){ play($("#url").value.trim(),$("#headers").value.trim(),"",0); };
$("#url").onkeydown=function(e){if(e.key==="Enter")$("#btnPlay").click();};
$("#btnSearch").onclick=function(){ state.query=$("#q").value.trim(); pushHistory(state.query,"搜索"); renderHub();
  if(state.query){ var code=state.query.toUpperCase(); state.currentCode=code; $("#subQ").value=code; if(/[A-Za-z]{2,5}[-_]?\d{2,5}/.test(code)) showDetail(code); }
};
$("#q").onkeydown=function(e){if(e.key==="Enter")$("#btnSearch").click();};
$$(".chip[data-group]").forEach(function(c){c.onclick=function(){ $$(".chip[data-group]").forEach(function(x){x.classList.remove("on");});c.classList.add("on");state.group=c.dataset.group;renderHub();};});

/* DOM 层广告拦截（脚本是 3795 域名 + 93 选择器；网页版做到 DOM 层） */
var AD_SEL='iframe[src*="ads"],[class*="ad-"],[id*="ad-"],[class*="popup"],[id*="popup"],[class*="modal-overlay"],ins.adsbygoogle,[data-ad-slot]';
function adblockTick(){ if(!state.settings.adblock)return; $$('body '+AD_SEL).forEach(function(e){ if(e.closest("#app")||e.closest("#panel")||e.closest("#modal"))return; e.remove(); }); }
setInterval(adblockTick,1200); new MutationObserver(adblockTick).observe(document.body,{childList:true,subtree:true});

/* 启动 */
$("#gwInput").value=(location.protocol==="file:"?"http://127.0.0.1:8765":location.origin).replace(/\/$/,"");
$("#btnView").textContent=state.view==="grid"?"▦ 网格":"☰ 列表";
applyTheme(state.settings.theme==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):(state.settings.theme||"dark"));
renderNav(); renderSiteNav(); renderHub(); renderPanelTabs();
log("就绪。站表 "+SITES.length+" · 字幕源 "+(SUB_SITES.length+SUB_APIS.length)+" · "+VERSION,"s");
log("提示：浏览器不能跨域解析站页，站点搜索以新标签打开；字幕加载受 CORS 限制时会提示打开站点。");
})();
</script>
